id: GAV-12
category: GARDE_A_VUE
title: Mandatory report entries (start, end, durations)
article: art. 64 CPP
applies_to: [garde_a_vue, hearing]
kind: missing_mention
condition_type: measurable
confidence: L
versions:
  - label: art. 64 CPP
    outcomes:
    - when: subtype == 'garde_a_vue' and acts('custody_end') == 0
      status: needs_reading
      say: No end-of-custody report for {name}.
      cite:
      - custody_start
    - when: subtype == 'garde_a_vue' and val('custody_end') is None
      status: possible_nullity
      say: 'End-of-custody report for {name}: end time not recorded.'
      cite:
      - custody_end
      - custody_end.end_date
      certainty: needs_reading
      kind: missing_mention
    - when: subtype == 'garde_a_vue'
      status: satisfied
      say: End time recorded ({hm(t('custody_end'))}).
      cite:
      - custody_end
    - when: subtype == 'hearing' and val('in_custody') and not defined('end')
      status: needs_reading
      say: Hearing end time not recorded.
      cite:
      - start
      kind: missing_mention
rights_at_stake: [review of the length of the measure]
next_steps:
  - Look for the missing time in other reports (custody register, transfer report).
prosecution_hints: [entry_elsewhere, no_prejudice]
judilibre_query: garde à vue mentions procès-verbal heure de fin
weight: 0.5
legal_todo: [Confidence-L rule — the exact list of entries must be validated.]
