id: PRQ-04
category: PERQUISITION_SAISIE
title: Seized item not placed under seal
article: art. 56 CPP
applies_to: [seizure]
needs: [seal_number]
condition_type: measurable
confidence: M
versions:
  - label: art. 56 CPP
    outcomes:
    - when: not defined('seal_number')
      status: skip
    - when: has('seal_number')
      status: satisfied
      say: Placed under seal {val('seal_number')}.
      cite:
      - seal_number
    - when: 'True'
      status: possible_nullity
      say: '"{val(''item'')}" seized with no record of being placed under seal.'
      cite:
      - seal_number
rights_at_stake: [integrity and traceability of evidence]
next_steps:
  - Look for a provisional seal or a later sealing report.
prosecution_hints: [later_seal, no_prejudice]
judilibre_query: saisie scellé inventaire perquisition
weight: 0.8
