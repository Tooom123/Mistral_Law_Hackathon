id: GAV-09
category: GARDE_A_VUE
title: Medical examination requested but not carried out
article: art. 63-3 CPP
applies_to: [garde_a_vue]
needs: [doctor_requested]
kind: missing_mention
condition_type: structural
confidence: M
versions:
  - label: art. 63-3 CPP
    outcomes:
    - when: not is_true('rights_notification.doctor_requested')
      status: skip
    - when: acts('medical_exam') > 0
      status: satisfied
      say: Medical examination carried out.
      cite:
      - medical_exam.exam_at
    - when: 'True'
      status: possible_nullity
      say: '{name} asked for a medical examination; no examination report or certificate in the file.'
      cite:
      - rights_notification.doctor_requested
      certainty: needs_reading
      kind: missing_mention
rights_at_stake: [right to health, dignity]
next_steps:
  - Look for a request to a doctor or a medical certificate outside the numbered file.
prosecution_hints: [document_outside_file, no_prejudice]
judilibre_query: garde à vue examen médical demandé non réalisé
weight: 0.8
