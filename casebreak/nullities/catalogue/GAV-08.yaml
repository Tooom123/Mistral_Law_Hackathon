rights_at_stake: [right to a lawyer, privilege against self-incrimination]
next_steps:
  - Check that there is no express waiver or written authorisation from the prosecutor.
  - List the statements taken during this hearing and how they were used later.
prosecution_hints: [waiver, prosecutor_authorisation, no_prejudice]
judilibre_query: garde à vue audition sans avocat délai de carence
weight: 1.0
legal_todo: [Details of the 2024 reform (confidence M) and date of entry into force to be confirmed.]
