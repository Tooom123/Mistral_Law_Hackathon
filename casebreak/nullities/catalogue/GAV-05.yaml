id: GAV-05
category: GARDE_A_VUE
title: Late notification — justification to be assessed
article: art. 63-1 CPP
applies_to: [rights_notification]
needs: [delay_justification]
condition_type: open_textured
confidence: M
versions:
  - label: art. 63-1 CPP
    let:
      delay: minutes(t('custody.custody_start'), t('notified_at'))
    outcomes:
    - when: not defined('delay_justification') or not exists('custody')
      status: skip
    - when: 'True'
      status: needs_reading
      say: '{(''Rights notified '' + dur(delay) + '' after custody began'') if delay is not None else ''Notification deferred''}; justification stated in the report: "{val(''delay_justification'')}". For the lawyer to assess.'
      cite:
      - custody.custody_start
      - notified_at
      - delay_justification
      certainty: inferred
      grey:
        attr: delay_justification
      details:
        delay_minutes: delay
    grey_zone: {judge_questions: [delay_justified]}
rights_at_stake: [rights of the defence]
next_steps:
  - Assess whether the justification found is an insurmountable circumstance (lawyer's call).
prosecution_hints: [delay_justified_claim]
judilibre_query: garde à vue notification différée ivresse justification
weight: 0.7
