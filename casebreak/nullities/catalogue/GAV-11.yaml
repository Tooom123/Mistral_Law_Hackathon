id: GAV-11
category: GARDE_A_VUE
title: Relative to be informed — request not followed by a notice
article: art. 63-2 CPP
applies_to: [garde_a_vue]
needs: [family_requested]
kind: missing_mention
condition_type: structural
confidence: M
versions:
  - valid_to: 2024-07-01
    label: art. 63-2 CPP, version before the law of 22 April 2024
    outcomes:
    - when: not is_true('rights_notification.family_requested')
      status: skip
    - when: acts('family_notice') > 0
      status: satisfied
      say: Relative informed.
      cite:
      - family_notice.family_notified_at
    - when: 'True'
      status: possible_nullity
      say: Relative to be informed was requested; no notice report in the file.
      cite:
      - rights_notification.family_requested
      certainty: needs_reading
      kind: missing_mention
  - valid_from: 2024-07-01
    label: art. 63-2 CPP, version from the law of 22 April 2024 ("any person they designate")
    outcomes:
    - when: not is_true('rights_notification.family_requested')
      status: skip
    - when: acts('family_notice') > 0
      status: satisfied
      say: Relative informed.
      cite:
      - family_notice.family_notified_at
    - when: 'True'
      status: possible_nullity
      say: Relative to be informed was requested; no notice report in the file.
      cite:
      - rights_notification.family_requested
      certainty: needs_reading
      kind: missing_mention
rights_at_stake: [right to have a relative informed]
next_steps:
  - Check for a notice report or a decision to defer the notice.
prosecution_hints: [notice_elsewhere, no_prejudice]
judilibre_query: garde à vue avis à famille proche
weight: 0.5
legal_todo: [Time limits and exceptions for informing a relative — TODO(legal).]
