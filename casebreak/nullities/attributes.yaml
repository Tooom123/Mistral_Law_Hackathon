# Attribute registry — the vocabulary the rules read on the graph.
#
# A rule (catalogue/*.yaml) reads attributes by name; this file says what each attribute IS, so the extractor
# can look for it in any police report without code: the Mistral extraction schema is generated from here,
# restricted to the attributes the catalogue actually needs for the act's subtype (dsl.needs_by_subtype).
#
#   type:     datetime (date + time of day) · date · bool · text · enum (with `values`)
#   derived:  true = computed by the graph linker (contradictions, seals, custody containers), never read from text
#   fr:       how French reports usually phrase it (helps the model; not a regex)
#
# Adding a rule that needs a new attribute = add it here. `tests/test_rules_as_data.py` fails if a rule reads an
# attribute that is not described.

arrest_time:            {type: datetime, description: "Date and time of the arrest", fr: "interpellons … le … à … heures"}
custody_start:          {type: datetime, description: "Start of police custody (garde à vue), as decided by the officer", fr: "décidons de placer en garde à vue … à compter de …"}
custody_end:            {type: datetime, description: "Date and time custody ended", fr: "mettons fin à la mesure de garde à vue … à …"}
custody_end_date:       {type: date, derived: true, description: "Date of the end-of-custody report when the time is missing"}
end_date:               {type: date, description: "Date of the end-of-custody report", fr: "le … (en-tête du procès-verbal de fin de garde à vue)"}
custody_start_conflict: {type: text, derived: true, description: "Different custody start times stated in different reports"}
notified_at:            {type: datetime, description: "Date and time the rights were notified to the person in custody", fr: "notifions à … les droits …, le … à …"}
delay_justification:    {type: text, description: "Circumstance stated to explain a late notification of rights", fr: "la notification des droits a été différée en raison de …"}
lawyer_requested:       {type: bool, description: "The person asked to be assisted by a lawyer", fr: "déclare souhaiter être assisté par Maître …"}
doctor_requested:       {type: bool, description: "The person asked for a medical examination", fr: "déclare souhaiter être examiné par un médecin"}
family_requested:       {type: bool, description: "The person asked for a relative / designated person to be informed", fr: "déclare souhaiter faire prévenir …"}
interpreter_present:    {type: bool, description: "An interpreter assisted during this act", fr: "par l'intermédiaire de …, interprète en langue …"}
understands_french:     {type: bool, description: "The person understands French", fr: "déclare ne pas comprendre la langue française"}
objectives_text:        {type: text, description: "Grounds / objectives stated for placing the person in custody", fr: "aux motifs que … (art. 62-2 CPP)"}
prosecutor_informed_at: {type: datetime, description: "Time the public prosecutor was informed of the custody", fr: "avisons à … heures M. le procureur de la République"}
special_regime:         {type: text, description: "Special custody regime invoked (organised crime, drugs, terrorism)", fr: "régime dérogatoire … article 706-73"}
extension_authorized:   {type: bool, description: "The custody extension was authorised", fr: "autorisons la prolongation de la garde à vue"}
extension_authorized_at: {type: datetime, description: "Date and time the extension was authorised", fr: "autorisation de prolongation … le … à …"}
in_custody:             {type: bool, description: "The person heard is currently in custody", fr: "actuellement en garde à vue"}
start:                  {type: datetime, description: "Date and time the act started (opening line of the report)", fr: "L'an … le … à … heures"}
end:                    {type: datetime, description: "Date and time the act ended", fr: "fin de l'audition à … / fin des opérations à …"}
lawyer_present:         {type: bool, description: "The lawyer was present during the hearing", fr: "en présence de Maître … / hors la présence de son avocat"}
lawyer_waiver:          {type: bool, description: "The person expressly waived the lawyer for this hearing", fr: "renonce expressément à l'assistance d'un avocat"}
prosecutor_authorization: {type: bool, description: "Written authorisation of the prosecutor to question without waiting for the lawyer", fr: "autorisation écrite … du procureur"}
lawyer_notified_at:     {type: datetime, description: "Time the lawyer was notified", fr: "avisons Maître … à …"}
lawyer_notified_at_stated: {type: datetime, description: "Time the lawyer was notified, as restated in a hearing report", fr: "avisé à … ,"}
family_notified_at:     {type: datetime, description: "Time the relative / designated person was informed", fr: "avisons … de la mesure"}
exam_at:                {type: datetime, description: "Time of the medical examination", fr: "examen médical … le … à …"}
is_home:                {type: bool, description: "The search took place in a home (domicile)", fr: "nous transportons au domicile de …"}
occupant_present:       {type: bool, description: "The occupant was present throughout the search", fr: "en présence constante de … occupant des lieux"}
witnesses_present:      {type: bool, description: "Two witnesses attended the search", fr: "en présence de deux témoins"}
consent:                {type: enum, values: [handwritten, verbal], description: "Form of the occupant's consent to the search (preliminary inquiry)", fr: "assentiment exprès … écrit de sa main / donne verbalement son accord"}
jld_authorization:      {type: bool, description: "Written and reasoned authorisation of the liberty and custody judge (JLD)", fr: "autorisation écrite et motivée du juge des libertés et de la détention"}
item:                   {type: text, description: "Description of the seized item", fr: "- un téléphone portable …, placé sous scellé n° S1 ;"}
seal_number:            {type: text, description: "Seal number of the seized item (e.g. S1)", fr: "placé sous scellé n° …"}
orphan_seals:           {type: text, derived: true, description: "Seals analysed with no matching seizure in the file"}
seal_label:             {type: text, description: "Seal number visible on a photograph", fr: "SCELLÉ N° …"}
exif_conflict:          {type: text, derived: true, description: "Photo EXIF time inconsistent with the search report"}
exif_conflict_search:   {type: text, derived: true, description: "Search act the photo is compared with"}
authorization_ref:      {type: text, description: "Reference of the authorisation / order the act executes", fr: "en exécution de l'autorisation n° … / de l'ordonnance n° …"}
authorization_date:     {type: date, description: "Date of the authorisation cited", fr: "délivrée par … en date du …"}
date:                   {type: datetime, description: "Date (and time) of the order, ruling or report", fr: "L'an … le …"}

# --- England & Wales road traffic (speeding case: notice of intended prosecution, s.1 Road Traffic Offenders Act 1988)
offence_at:             {type: datetime, description: "Date and time the offence was committed (as recorded by the enforcement authority)", en: "Date and time of offence: 23 January 2018 at 14:36"}
offence_place:          {type: text, description: "Place of the offence", en: "Place of offence: A40 Westway, Paddington"}
speed_recorded:         {type: text, description: "Speed recorded by the detection device (mph)", en: "Recorded speed: 59 mph"}
speed_limit:            {type: text, description: "Posted speed limit (mph)", en: "Posted speed limit: 40 mph"}
keeper_name:            {type: text, description: "Registered keeper of the vehicle at the date of the offence", en: "Registered keeper at the date of the offence: ..."}
nip_posted_at:          {type: datetime, description: "Date and time the notice of intended prosecution was posted", en: "Date and time of posting: 2 February 2018 at 16:30"}
nip_addressee:          {type: text, description: "Person the notice of intended prosecution is addressed to", en: "Addressed to: ..."}
nip_service_method:     {type: text, description: "Method of service stated on the notice (first class post, recorded delivery…)", en: "Method of service: first class post"}
offence_stated_at:      {type: datetime, description: "Date and time of the offence as stated in the notice", en: "Offence date and time stated: ..."}
offence_place_stated:   {type: text, description: "Place of the offence as stated in the notice", en: "Offence place stated: ..."}
offence_nature_stated:  {type: text, description: "Nature of the offence as stated in the notice", en: "Nature of offence stated: ..."}
nip_received_at:        {type: datetime, description: "Date and time the notice of intended prosecution was received by the registered keeper (post room register)", en: "Received: 7 February 2018 at 09:40 - Notice of intended prosecution ..."}
nip_received_stated:    {type: datetime, description: "Date and time of receipt of the notice as stated in a witness statement", en: "I opened the envelope ... on 7 February 2018 at 09:40"}
driver_name:            {type: text, description: "Driver identified in response to the notice", en: "identifies the driver ... as ..."}
response_date:          {type: datetime, description: "Date of the registered keeper's response to the notice", en: "Date of response: 12 February 2018"}
summons_date:           {type: datetime, description: "Date the summons was issued", en: "Date of summons: 2 July 2018"}
hearing_at:             {type: datetime, description: "Date of the court hearing", en: "Date of hearing: 28 August 2018"}
plea:                   {type: text, description: "Plea entered at the hearing", en: "Plea: not guilty"}
statement_date:         {type: datetime, description: "Date of a witness statement", en: "Date of statement: 20 August 2018"}
notice_date:            {type: datetime, description: "Date of the notice of intended prosecution", en: "Date of notice: 2 February 2018"}
enquiry_date:           {type: datetime, description: "Date of the registered keeper enquiry", en: "Date of enquiry: 24 January 2018"}
court:                  {type: text, description: "Court named on the document", en: "Court: Wimbledon Magistrates' Court"}
