[project]
name = "casebreak"
version = "0.1.0"
description = "Find procedural defects in French criminal case files, with the page number."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "networkx>=3.3",
  "reportlab>=4.2",
  "pypdf>=4.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
casebreak = "casebreak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casebreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
